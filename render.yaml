services:
  - type: web
    name: frex-web-api
    runtime: python
    plan: free
    rootDir: render_api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FREX_ALLOWED_ORIGINS
        value: https://pavankumar7893.github.io,http://localhost:5500,http://127.0.0.1:5500
